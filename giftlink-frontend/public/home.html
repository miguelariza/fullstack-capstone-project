<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/home.css">
</head>
<body>
    <div class="container content my-5">
        <div class="row">
            <div class="col-12">
                <div class="text-center p-4">
                    <!-- leaf / earth symbol -->
                    <div class="leaf-icon">🌿</div>
                    <!-- Task 1: Add the main heading -->
                        <h1 class="display-4">Give, Receive, Repeat... Sustainably</h1>
                    
                    <!-- Task 2: Add the subheading -->
                        <h4 class="mb-4">Free household items for those who love to recycle. Declutter responsibly and discover hidden gems without spending a dime.</h4>
                    
                    <!-- Task 3: Add the inspirational quote -->
                    <p class="lead mb-4">
                        "Sustainability starts with a single choice: to reuse, to share, to care."
                    </p>                    
                    <!-- Task 4: Add the 'Get Started' button -->
                    <a href="/app" class="btn btn-success btn-lg" tabindex="-1" role="button" aria-disabled="true">Get Started</a>
                </div>
            </div>
        </div>
    </div>
        <!-- Bootstrap JavaScript Bundle (for interactive components) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
